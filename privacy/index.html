<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policies — Mind Upgrade LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f9f8f6; --ink:#1a1a18; --muted:#7a7870; --accent:#c45e1a; --accent-light:#f5ede4; --border:#e2e0db; --radius:20px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; margin: 0 auto; padding: 80px 24px 100px; }
    .back { font-size: 0.82rem; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }
    h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 2.4rem; margin: 24px 0 12px; }
    .intro { color: var(--muted); font-size: 0.95rem; margin-bottom: 40px; }
    ul { list-style: none; border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    li + li { border-top: 1.5px solid var(--border); }
    li > a, li > span { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; text-decoration: none; color: var(--ink); }
    li a { transition: background 0.2s; }
    li a:hover { background: var(--accent-light); }
    .name { font-weight: 500; }
    .meta { font-size: 0.8rem; color: var(--muted); }
    li a .meta { color: var(--accent); }
    footer { margin-top: 48px; font-size: 0.78rem; color: var(--muted); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Mind Upgrade</a>
    <h1>Privacy Policies</h1>
    <p class="intro">Each of our apps has its own privacy policy describing exactly what it collects and why.</p>
    <ul>
      <li><a href="/privacy/stoicize"><span class="name">Stoicize</span><span class="meta">Read policy →</span></a></li>
    </ul>
    <footer>Questions? <a href="mailto:jason@mindupgradeapps.com">jason@mindupgradeapps.com</a></footer>
  </main>
</body>
</html>
